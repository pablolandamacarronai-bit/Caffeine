  save(key, data) {
    try { localStorage.setItem('training_' + key, JSON.stringify(data)); } catch(e) {}
  },
  load(key, fallback) {
    try {
      const val = localStorage.getItem('training_' + key);
      return val ? JSON.parse(val) : fallback;
    } catch(e) { return fallback; }
  },
  getLastSession(type) {
    const sessions = this.load('weightSessions', APP_DATA.weightSessions);
    return sessions.filter(s => s.type === type).sort((a,b) => b.date.localeCompare(a.date))[0];
  },
  getAllSessions() {
    return this.load('weightSessions', APP_DATA.weightSessions);
  },
  saveSession(session) {
    const sessions = this.getAllSessions();
    const idx = sessions.findIndex(s => s.id === session.id);
    if (idx >= 0) sessions[idx] = session;
    else sessions.push(session);
    this.save('weightSessions', sessions);
  },
  getRunSessions() {
    return this.load('runningSessions', APP_DATA.runningSessions);
  },
  saveRunSession(session) {
    const sessions = this.getRunSessions();
    const idx = sessions.findIndex(s => s.id === session.id);
    if (idx >= 0) sessions[idx] = session;
    else sessions.push(session);
    this.save('runningSessions', sessions);
  },
  getTennisSessions() {
    return this.load('tennisSessions', APP_DATA.tennisSessions);
  },
  getExerciseHistory(exerciseId) {
    const sessions = this.getAllSessions();
    const result = [];
    sessions.forEach(s => {
      const ex = s.exercises && s.exercises.find(e => e.id === exerciseId);
      if (ex) {
        const maxWeight = Math.max(...ex.sets.map(set => set.weight));
        const avgReps = ex.sets.reduce((a, b) => a + b.reps, 0) / ex.sets.length;
        result.push({ date: s.date, weight: maxWeight, reps: Math.round(avgReps), type: s.type });
      }
    });
    const phase1 = APP_DATA.progressionData[exerciseId] || [];
    phase1.forEach(p => {
      if (!result.find(r => r.date === p.date)) {
        result.push({ date: p.date, weight: p.weight, reps: p.reps, type: 'fase1', note: p.note });
      }
    });
    return result.sort((a,b) => a.date.localeCompare(b.date));
  },
  getRunStreak() {
    const sessions = this.getRunSessions().sort((a,b) => b.date.localeCompare(a.date));
    if (!sessions.length) return 0;
    let streak = 0;
    const today = new Date();
    let checkWeek = new Date(today);
    checkWeek.setDate(checkWeek.getDate() - checkWeek.getDay());
    for (let i = 0; i < 20; i++) {
      const weekStart = new Date(checkWeek);
      const weekEnd = new Date(checkWeek);
      weekEnd.setDate(weekEnd.getDate() + 6);
      const hasRun = sessions.some(s => {
        const d = new Date(s.date);
        return d >= weekStart && d <= weekEnd;
      });
      if (!hasRun && i > 0) break;
      if (hasRun) streak++;
      checkWeek.setDate(checkWeek.getDate() - 7);
    }
    return streak;
  }
};

    --font: 'DM Sans', system-ui, -apple-system, sans-serif;

  }
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

  #root { height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }

  .phone-shell {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px #222, 0 32px 80px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 430px) {
    #root { align-items: flex-start; background: var(--bg); }
    .phone-shell { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
  @media (max-height: 860px) and (min-width: 431px) {
    .phone-shell { transform: scale(calc(min(100vh - 40px, 844px) / 844px)); transform-origin: center center; }
  }

  .app-header {
    height: 52px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: env(safe-area-inset-top, 0px);

    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .screen-container {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .screen {
    position: absolute; inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 80px;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  .screen-slide-in { animation: slideIn 0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
  .screen-slide-out { animation: slideOut 0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0.6; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-30%); opacity: 0; } }

  /* Tab bar */
  .tab-bar {
    height: 80px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: stretch;
    flex-shrink: 0;

  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;

    font-weight: 500;

  .tab-item svg { width: 22px; height: 22px; }

  .page-header {
    padding: 20px 20px 8px;
    display: flex;
    align-items: baseline;

  .input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    padding: 10px 12px;

    transition: border-color 0.15s;

  .input-sm { font-size: 16px; padding: 8px 10px; text-align: center; width: 64px; font-weight: 600; font-family: var(--font-mono); }

    border-radius: var(--radius);
    border: none;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;

  .btn-primary:active { background: #e06010; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .metric-row { display: flex; gap: 10px; margin: 0 16px 10px; }

  .exercise-num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--muted2); flex-shrink: 0; }
  .exercise-info { flex: 1; min-width: 0; }
  .exercise-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exercise-meta { font-size: 12px; color: var(--muted2); margin-top: 2px; }
  .exercise-weight { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .exercise-status { font-size: 16px; }

  /* Set log table */
  .set-table { width: 100%; border-collapse: collapse; }
  .set-table th { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 8px; text-align: center; }
  .set-table td { padding: 4px 4px; text-align: center; }

  /* Chart placeholder */
  .chart-area { height: 120px; display: flex; align-items: flex-end; gap: 3px; padding: 0 4px; }
  .chart-bar { flex: 1; border-radius: 3px 3px 0 0; min-width: 0; transition: height 0.4s ease; }

  /* Alert */
  .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm); margin-bottom: 8px; }
  .alert-warn { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.25); color: #fbbf24; }
  .alert-danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
  .alert-info { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: #60a5fa; }
  .alert-text { font-size: 12px; line-height: 1.5; }

  /* Streak dots */
  .streak-dots { display: flex; gap: 4px; align-items: center; }
  .streak-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Floating action */
  .fab {
    position: absolute;
    bottom: 88px;
    right: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(249,115,22,0.4);
    z-index: 10;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.93); }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 4px 16px; }

  /* Running pace viz */
  .pace-line { display: flex; align-items: center; gap: 8px; }
  .pace-bar-outer { flex: 1; height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; }
  .pace-bar-inner { height: 100%; border-radius: 3px; }

  /* Phase timeline */
  .phase-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .phase-row:last-child { border-bottom: none; }
  .phase-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .phase-active { background: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.25); }
  .phase-done { background: var(--muted); }
  .phase-upcoming { background: var(--surface3); border: 2px solid var(--border); }

  /* Smooth scrolling on content areas */
  .scroll-snap { scroll-snap-type: x mandatory; display: flex; overflow-x: auto; scrollbar-width: none; }
  .scroll-snap::-webkit-scrollbar { display: none; }
  .snap-item { scroll-snap-align: start; flex-shrink: 0; }

  .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag-new { background: rgba(249,115,22,0.15); color: var(--running); }

  .chevron-right { color: var(--muted); font-size: 14px; }

  .back-btn { background: none; border: none; color: var(--muted2); font-size: 14px; font-weight: 500; font-family: var(--font); cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; }

  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>

<script type="text/babel">
// ── TWEAKS PANEL (inlined) ──────────────────────────────────────────────────
const __TWEAKS_STYLE = `

    max-height:calc(100vh - 32px);display:flex;flex-direction:column;

  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;

`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e && e.data && e.data.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      panel.style.right = Math.max(8, offsetRef.current.x) + 'px';
      panel.style.bottom = Math.max(8, offsetRef.current.y) + 'px';
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
        onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value} onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

const { useState, useEffect, useRef, useCallback } = React;
const D = window.APP_DATA;
const DB = window.TrainingDB;

// ---- HELPERS ----
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
}
function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: '2-digit' });
}
function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function paceColor(pace) {
  // pace like "6:20"
  const [m, s] = pace.split(':').map(Number);
  const total = m * 60 + s;
  if (total <= 360) return '#22c55e'; // fast
  if (total <= 420) return '#f97316'; // ok
  return '#ef4444'; // slow
}
function typeColor(type) {
  return { pull: '#3b82f6', push: '#ef4444', leg: '#22c55e', running: '#f97316', tennis: '#eab308', bike: '#a855f7', rest: '#444' }[type] || '#666';
}
function typeLabel(type) {
  return { pull: 'Pull', push: 'Push', leg: 'Leg', running: 'Running', tennis: 'Tenis', bike: 'Bici', rest: 'Descanso' }[type] || type;
}
function typeIcon(type) {
  return { pull: '💪', push: '🔴', leg: '🦵', running: '🏃', tennis: '🎾', bike: '🚴', rest: '😴' }[type] || '•';
}
function getWeekDays() {
  const today = new Date();
  const mon = new Date(today);
  mon.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  return Array.from({length: 7}, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}
function isoDate(d) {
  return d.toISOString().split('T')[0];
}
function currentTime() {
  const n = new Date();
  return `${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`;
}
function weeksUntil(dateStr) {
  const diff = new Date(dateStr) - new Date();
  return Math.max(0, Math.ceil(diff / (7 * 24 * 3600 * 1000)));
}
function weeksElapsed(dateStr) {
  const diff = new Date() - new Date(dateStr);
  return Math.max(0, Math.floor(diff / (7 * 24 * 3600 * 1000)));
}
function getActiveWeightsPhase() {
  const today = isoDate(new Date());
  return D.phases.weights.find(p => p.start <= today && (!p.end || today <= p.end))
    || D.phases.weights[D.phases.weights.length - 1];
}
function getActiveRunPhase() {
  const today = isoDate(new Date());
  return D.phases.running.find(p => p.start <= today && (!p.end || today <= p.end))
    || D.phases.running[D.phases.running.length - 1];
}
function getNextSession() {
  const today = new Date();
  const dow = today.getDay();
  for (let i = 1; i <= 7; i++) {
    const nextDow = (dow + i) % 7;
    if (D.weekSchedule[nextDow] && D.weekSchedule[nextDow].length > 0 && D.weekSchedule[nextDow][0].type !== 'rest') {
      const d = new Date(today);
      d.setDate(today.getDate() + i);
      return { sessions: D.weekSchedule[nextDow], date: d, daysAway: i };
    }
  }
}

// ---- MINI CHART ----
function MiniChart({ data, color = '#f97316', height = 60 }) {
  if (!data || data.length < 2) return null;
  const max = Math.max(...data);
  const min = Math.min(...data) * 0.95;
  const range = max - min || 1;
  const W = 200, H = height;
  const pts = data.map((v, i) => [
    (i / (data.length - 1)) * W,
    H - ((v - min) / range) * (H - 8) - 4
  ]);
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area = path + ` L${W},${H} L0,${H} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%', height}} preserveAspectRatio="none">
      <defs>
        <linearGradient id={`grad_${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#grad_${color.replace('#','')})`}/>
      <path d={path} stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="3" fill={color}/>
    </svg>
  );
}

// ---- PROGRESS RING ----
function Ring({ pct, color, size = 56, stroke = 5, children }) {
  const r = (size - stroke * 2) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct);
  return (
    <div style={{position:'relative', width: size, height: size, flexShrink: 0}}>
      <svg width={size} height={size} style={{transform:'rotate(-90deg)'}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface3)" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
          style={{transition: 'stroke-dashoffset 0.6s ease'}}/>
      </svg>
      <div style={{position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center'}}>
        {children}
      </div>
    </div>
  );
}

function CoachDashboard() {
  const [copied, setCopied] = React.useState(false);
  const [selectedId, setSelectedId] = React.useState('');
  const topInsights = generateInsights().slice(0, 2);

  const allSessions = [
    ...DB.getAllSessions().map(s => ({...s, _kind:'weights'})),
    ...DB.getRunSessions().map(s => ({...s, _kind:'running'}))
  ].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 8);

  const selected = selectedId ? allSessions.find(s => s.id === selectedId) : null;

  function sessionLabel(s) {
    if (s._kind === 'running') return `🏃 Running ${s.distance}km — ${s.date}`;
    return `💪 ${s.type.toUpperCase()} Day — ${s.date}`;
  }

  function buildText() {
    if (!selected) return generateReport();
    if (selected._kind === 'running') {
      const mins = Math.floor(selected.time / 60), secs = selected.time % 60;
      return `[Running — ${selected.date}]\nDistancia: ${selected.distance}km  Ritmo: ${selected.pace}/km\nTiempo: ${mins}min${secs > 0 ? ' ' + secs + 's' : ''}\nDesnivel: +${selected.elevation}m  Lugar: ${selected.location || '-'}\nNotas: ${selected.notes || '-'}`;
    }
    const defs = D.exercises.fase2[selected.type] || [];
    let txt = `[${selected.type.toUpperCase()} DAY — ${selected.date}]\n`;
    (selected.exercises || []).forEach(ex => {
      const def = defs.find(e => e.id === ex.id);
      const name = def?.name || ex.id;
      const sets = (ex.sets || []).map(st => `${st.reps}×${st.weight}kg`).join(' / ');
      const hit = def && !def.isCore && (ex.sets || []).every(st => st.reps >= (def.reps || 10));
      txt += `  ${name}: ${sets}${hit ? ' ✅' : ''}\n`;
    });
    return txt;
  }

  function doCopy() {
    const txt = buildText();
    navigator.clipboard.writeText(txt).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    }).catch(() => {
      const el = document.createElement('textarea');
      el.value = txt; document.body.appendChild(el); el.select();
      document.execCommand('copy'); document.body.removeChild(el);
      setCopied(true); setTimeout(() => setCopied(false), 2500);
    });
  }

  return (
    <>
      {topInsights.length > 0 && (
        <>
          <div className="section-label">Coach</div>
          {topInsights.map((ins, i) => (
            <div key={i} className="card" style={{margin:'0 16px 8px', padding:'12px 14px',
              borderLeft:`3px solid ${ins.color}`, display:'flex', gap:10, alignItems:'flex-start'}}>
              <span style={{fontSize:18, flexShrink:0, lineHeight:1.4}}>{ins.icon}</span>
              <div>
                <div style={{fontSize:12, fontWeight:700, color:ins.color, marginBottom:2}}>{ins.title}</div>
                <div style={{fontSize:12, color:'var(--muted2)', lineHeight:1.4}}>{ins.text}</div>
              </div>
            </div>
          ))}
        </>
      )}
      <div style={{margin:'8px 16px 0'}}>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)}
          className="input" style={{fontSize:12, padding:'8px 10px', marginBottom:6,
            color: selectedId ? 'var(--text)' : 'var(--muted)'}}>
          <option value="">Informe completo</option>
          {allSessions.map(s => <option key={s.id} value={s.id}>{sessionLabel(s)}</option>)}
        </select>
        <button className="btn btn-secondary btn-full" onClick={doCopy} style={{fontSize:13, gap:8}}>
          {copied
            ? <><span>✅</span> Copiado — pégalo en Claude</>
            : <><span>📋</span> {selected ? 'Copiar sesión para Claude' : 'Copiar informe para Claude'}</>}
        </button>
      </div>
    </>
  );
}

function SessionScreen({ params, onNavigate, onBack }) {
  const { type } = params || { type: 'pull' };
  const color = typeColor(type);
  const exList = D.exercises.fase2[type] || [];
  const lastSession = DB.getLastSession(type);
  const [sets, setSets] = useState(() => {
    // init from plan
    return exList.map(ex => ({
      id: ex.id,
      sets: Array.from({length: ex.series}, () => ({ reps: ex.reps || 0, weight: ex.weight, done: false })),
      notes: ''
    }));
  });
  const [activeEx, setActiveEx] = useState(null);
  const [saved, setSaved] = useState(false);

  function getLastExData(exId) {
    if (!lastSession) return null;
    return lastSession.exercises?.find(e => e.id === exId);
  }

  function updateSet(exIdx, setIdx, field, value) {
    setSets(prev => {
      const next = prev.map(ex => ({...ex, sets: ex.sets.map(s => ({...s}))}));
      next[exIdx].sets[setIdx][field] = value;
      return next;
    });
  }

  function toggleDone(exIdx, setIdx) {
    setSets(prev => {
      const next = prev.map(ex => ({...ex, sets: ex.sets.map(s => ({...s}))}));
      next[exIdx].sets[setIdx].done = !next[exIdx].sets[setIdx].done;
      return next;
    });
  }

  function getStatus(exIdx) {
    const cur = sets[exIdx];
    const prev = getLastExData(cur.id);
    if (!prev) return null;
    const curMax = Math.max(...cur.sets.map(s => s.weight));
    const prevMax = Math.max(...prev.sets.map(s => s.weight));
    const curReps = cur.sets.reduce((a,b) => a + (b.reps||0), 0);
    const prevReps = prev.sets.reduce((a,b) => a + (b.reps||0), 0);
    if (curMax > prevMax) return 'up';
    if (curReps > prevReps) return 'reps-up';
    if (curMax < prevMax) return 'down';
    return 'same';
  }

  function save() {
    const session = {
      id: `w${Date.now()}`,
      date: isoDate(new Date()),
      type,
      phase: 'fase2',
      exercises: sets.map(ex => ({
        id: ex.id,
        sets: ex.sets.map(s => ({ reps: Number(s.reps), weight: Number(s.weight) }))
      }))
    };
    DB.saveSession(session);
    setSaved(true);
    setTimeout(() => onBack(), 1200);
  }

  if (saved) {
    return (
      <div className="screen" style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16}}>
        <div style={{fontSize:56}}>✅</div>
        <div style={{fontSize:20, fontWeight:700}}>Sesión guardada</div>
        <div style={{fontSize:14, color:'var(--muted)'}}>Buen trabajo, Pablo</div>
      </div>
    );
  }

  return (
    <div className="screen">
      <div style={{padding:'16px 20px 12px', position:'sticky', top:0, background:'var(--bg)', zIndex:10, borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:12}}>
        <button className="back-btn" onClick={onBack}>
          <span style={{fontSize:18}}>‹</span> Inicio
        </button>
        <div style={{flex:1}}></div>
        <div style={{fontSize:13, fontWeight:700, color:color, textTransform:'uppercase', letterSpacing:'0.06em'}}>
          {typeLabel(type)} DAY
        </div>
        <span className={`badge badge-${type}`} style={{fontSize:11}}>{isoDate(new Date()).slice(5)}</span>
      </div>

      {/* Phase reminder */}
      <div style={{margin:'10px 16px 0'}}>
        <div className="alert alert-info" style={{marginBottom:0}}>
          {Icons.info}
          <div className="alert-text">Fase 2 — Hipertrofia · Reps objetivo: 10-12 · Técnica prioritaria sobre peso</div>
        </div>
      </div>

      {exList.map((ex, exIdx) => {
        const status = getStatus(exIdx);
        const isOpen = activeEx === exIdx;
        const allDone = sets[exIdx].sets.every(s => s.done);
        return (
          <div key={ex.id} className="card" style={{margin:'10px 16px 0', padding:0, overflow:'hidden'}}>
            {/* Exercise header */}
            <div style={{padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:'pointer',
              background: allDone ? `${color}10` : 'transparent'}}
              onClick={() => setActiveEx(isOpen ? null : exIdx)}>
              <div style={{width:28, height:28, borderRadius:'50%', background:`${color}20`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:12, fontWeight:700, color, flexShrink:0}}>{exIdx+1}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:'flex', alignItems:'center', gap:6}}>
                  <span style={{fontSize:14, fontWeight:700, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{ex.name}</span>
                  {ex.isCore && <span className="tag tag-new">Core</span>}
                </div>
                <div style={{fontSize:11, color:'var(--muted)', marginTop:2}}>
                  {ex.isCore ? ex.notes : `${ex.series}×${ex.reps || '15'} · ${ex.weight > 0 ? ex.weight + 'kg' : 'Peso corporal'}`}
                </div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:8, flexShrink:0}}>
                {status === 'up' && <span title="Mejor peso">⬆️</span>}
                {status === 'reps-up' && <span title="Más reps">✅</span>}
                {status === 'same' && <span title="Igual">➡️</span>}
                {status === 'down' && <span title="Menos peso">🔴</span>}
                {allDone && <span style={{color:color, fontSize:16}}>{Icons.check}</span>}
                <span style={{color:'var(--muted)', fontSize:14, transition:'transform 0.2s', display:'block', transform: isOpen ? 'rotate(90deg)' : 'rotate(0)'}}>{Icons.chevLeft}</span>
              </div>
            </div>

            {/* Set log (expanded) */}
            {isOpen && (
              <div style={{borderTop:'1px solid var(--border)'}}>
                {/* Notes */}
                {ex.notes && (
                  <div style={{padding:'8px 14px', background:'var(--surface2)', fontSize:12, color:'var(--muted2)', fontStyle:'italic'}}>
                    💡 {ex.notes}
                  </div>
                )}
                {/* Last session reference */}
                {getLastExData(ex.id) && (
                  <div style={{padding:'6px 14px', background:'rgba(59,130,246,0.06)', display:'flex', gap:8, alignItems:'center'}}>
                    <span style={{fontSize:11, color:'var(--pull)'}}>Anterior:</span>
                    {getLastExData(ex.id).sets.map((s,i) => (
                      <span key={i} style={{fontSize:11, fontFamily:'var(--font-mono)', color:'var(--muted2)'}}>
                        {s.reps}×{s.weight}
                      </span>
                    ))}
                  </div>
                )}
                {/* Sets */}
                <div style={{padding:'10px 14px'}}>
                  <div style={{display:'flex', gap:4, marginBottom:8, fontSize:11, fontWeight:600, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.06em'}}>
                    <div style={{width:32}}>Set</div>
                    <div style={{flex:1, textAlign:'center'}}>Reps</div>
                    <div style={{flex:1, textAlign:'center'}}>Kg</div>
                    <div style={{width:32}}></div>
                  </div>
                  {!ex.isCore && sets[exIdx].sets.map((s, sIdx) => (
                    <div key={sIdx} style={{display:'flex', gap:4, alignItems:'center', marginBottom:6,
                      opacity: s.done ? 0.6 : 1, transition:'opacity 0.2s'}}>
                      <div style={{width:32, fontSize:13, fontWeight:600, color:'var(--muted)', fontFamily:'var(--font-mono)'}}>{sIdx+1}</div>
                      <div style={{flex:1, textAlign:'center'}}>
                        <input type="number" className="input input-sm" value={s.reps}
                          style={{width:'100%', background: s.done ? `${color}15` : 'var(--surface2)', borderColor: s.done ? color : 'var(--border)'}}
                          onChange={e => updateSet(exIdx, sIdx, 'reps', e.target.value)}/>
                      </div>
                      <div style={{flex:1, textAlign:'center'}}>
                        <input type="number" step="0.5" className="input input-sm" value={s.weight}
                          style={{width:'100%', background: s.done ? `${color}15` : 'var(--surface2)', borderColor: s.done ? color : 'var(--border)'}}
                          onChange={e => updateSet(exIdx, sIdx, 'weight', e.target.value)}/>
                      </div>
                      <button style={{width:32, height:36, borderRadius:8, border:'none', cursor:'pointer',
                        background: s.done ? color : 'var(--surface3)', color: s.done ? '#fff' : 'var(--muted)',
                        display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0}}
                        onClick={() => toggleDone(exIdx, sIdx)}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                      </button>
                    </div>
                  ))}
                  {ex.isCore && (
                    <div style={{padding:'8px 0', color:'var(--muted2)', fontSize:13}}>
                      <div>· Plancha: 3 × 45 segundos</div>
                      <div style={{marginTop:4}}>· Hollow rocks: 3 × 12 reps</div>
                      <button style={{marginTop:8, padding:'6px 16px', borderRadius:8, border:`1px solid ${color}`, background:`${color}15`, color, fontSize:13, fontWeight:600, cursor:'pointer', fontFamily:'var(--font)'}}
                        onClick={() => toggleDone(exIdx, 0)}>
                        {sets[exIdx].sets[0]?.done ? '✅ Completado' : 'Marcar completado'}
                      </button>
                    </div>
                  )}
                  {/* Progression suggestion */}
                  {getLastExData(ex.id) && (() => {
                    const prev = getLastExData(ex.id);
                    const allFullReps = prev.sets.every(s => s.reps >= (ex.reps || 10));
                    if (allFullReps && !ex.isCore) {
                      return (
                        <div style={{marginTop:8, padding:'8px 10px', borderRadius:8, background:'rgba(34,197,94,0.1)', border:'1px solid rgba(34,197,94,0.2)', fontSize:12, color:'#4ade80'}}>
                          💡 Anterior: todas las series al objetivo. Considera +{ex.increment}kg hoy.
                        </div>
                      );
                    }
                    return null;
                  })()}
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div style={{padding:'16px'}}>
        <button className="btn btn-primary btn-full" onClick={save}>
          {Icons.check} Guardar sesión
        </button>
      </div>
    </div>
  );
}

// SCREEN: RUN LOG — log a running session

function RunLogScreen({ onBack }) {
  const [form, setForm] = useState({
    date: isoDate(new Date()),
    distance: '',
    minutes: '',
    seconds: '',
    elevation: '',
    location: '',
    type: 'easy',
    notes: ''
  });
  const [saved, setSaved] = useState(false);

  function set(field, val) { setForm(p => ({...p, [field]: val})); }

  const totalSecs = (Number(form.minutes) || 0) * 60 + (Number(form.seconds) || 0);
  const dist = parseFloat(form.distance) || 0;
  const pace = dist > 0 && totalSecs > 0 ? (() => {
    const secsPerKm = totalSecs / dist;
    return `${Math.floor(secsPerKm / 60)}:${String(Math.round(secsPerKm % 60)).padStart(2,'0')}`;
  })() : '--:--';

  function save() {
    if (!dist || !totalSecs) return;
    DB.saveRunSession({
      id: `r${Date.now()}`,
      date: form.date,
      distance: dist,
      time: totalSecs,
      pace,
      elevation: Number(form.elevation) || 0,
      location: form.location,
      type: form.type,
      notes: form.notes
    });
    setSaved(true);
    setTimeout(() => onBack(), 1200);
  }

  if (saved) {
    return (
      <div className="screen" style={{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:16}}>
        <div style={{fontSize:56}}>🏃</div>
        <div style={{fontSize:20, fontWeight:700}}>Sesión guardada</div>
        <div style={{fontSize:14, color:'var(--muted)'}}>Ritmo: {pace} /km</div>
      </div>
    );
  }

  return (
    <div className="screen">
      <div style={{padding:'16px 20px 12px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:12}}>
        <button className="back-btn" onClick={onBack}>‹ Inicio</button>
        <div style={{flex:1}}></div>
        <span style={{fontSize:13, fontWeight:700, color:'var(--running)', textTransform:'uppercase', letterSpacing:'0.06em'}}>Nueva sesión</span>
      </div>

      {/* Pace indicator */}
      <div style={{margin:'16px 16px 0', padding:'16px', background:'var(--surface)', borderRadius:'var(--radius)', border:'1px solid var(--border)', textAlign:'center'}}>
        <div style={{fontSize:42, fontWeight:700, fontFamily:'var(--font-mono)', color: pace !== '--:--' ? paceColor(pace) : 'var(--muted)', letterSpacing:'-1px'}}>{pace}</div>
        <div style={{fontSize:12, color:'var(--muted)', marginTop:2}}>min/km</div>
        {pace !== '--:--' && (
          <div style={{marginTop:8, fontSize:12, color:'var(--muted2)'}}>
            {(() => {
              const [m,s] = pace.split(':').map(Number);
              const total = m*60+s;
              if (total <= 370) return <span style={{color:'#f87171'}}>⚠️ Demasiado rápido para Fase 1</span>;
              if (total <= 410) return <span style={{color:'var(--running)'}}>✅ Ritmo ideal (zona conversacional)</span>;
              return <span style={{color:'var(--muted2)'}}>Ritmo suave</span>;
            })()}
          </div>
        )}
      </div>

      <div style={{padding:'16px 16px 0', display:'flex', flexDirection:'column', gap:14}}>
        {/* Date */}
        <div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>FECHA</div>
          <input type="date" className="input" value={form.date} onChange={e => set('date', e.target.value)}/>
        </div>

        {/* Distance */}
        <div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>DISTANCIA</div>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            <input type="number" step="0.01" placeholder="0.00" className="input" style={{fontSize:22, fontWeight:700, fontFamily:'var(--font-mono)', textAlign:'center'}}
              value={form.distance} onChange={e => set('distance', e.target.value)}/>
            <span style={{fontSize:16, fontWeight:600, color:'var(--muted)', flexShrink:0}}>km</span>
          </div>
        </div>

        {/* Time */}
        <div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>TIEMPO</div>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            <input type="number" placeholder="00" className="input input-sm" style={{flex:1, fontSize:24}}
              value={form.minutes} onChange={e => set('minutes', e.target.value)}/>
            <span style={{fontSize:20, fontWeight:700, color:'var(--muted)'}}>:</span>
            <input type="number" placeholder="00" className="input input-sm" style={{flex:1, fontSize:24}}
              value={form.seconds} onChange={e => set('seconds', e.target.value)}/>
            <span style={{fontSize:14, color:'var(--muted)', flexShrink:0}}>min · seg</span>
          </div>
        </div>

        {/* Elevation + location */}
        <div style={{display:'flex', gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>DESNIVEL (m)</div>
            <input type="number" placeholder="0" className="input" value={form.elevation} onChange={e => set('elevation', e.target.value)}/>
          </div>
          <div style={{flex:2}}>
            <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>LUGAR</div>
            <input type="text" placeholder="Madrid..." className="input" value={form.location} onChange={e => set('location', e.target.value)}/>
          </div>
        </div>

        {/* Type */}
        <div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>TIPO</div>
          <div style={{display:'flex', gap:6, flexWrap:'wrap'}}>
            {[['easy','Rodaje suave'],['long','Tirada larga'],['tempo','Tempo'],['intervals','Series']].map(([val, label]) => (
              <button key={val} onClick={() => set('type', val)} style={{padding:'6px 14px', borderRadius:8, border:`1px solid ${form.type === val ? 'var(--running)' : 'var(--border)'}`,
                background: form.type === val ? 'rgba(249,115,22,0.15)' : 'var(--surface2)', color: form.type === val ? 'var(--running)' : 'var(--muted)',
                fontSize:13, fontWeight:600, cursor:'pointer', fontFamily:'var(--font)'}}>
                {label}
              </button>
            ))}
          </div>
        </div>

        {/* Notes */}
        <div>
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:6}}>NOTAS</div>
          <textarea className="input" rows={2} placeholder="Sensaciones, gemelos, plantas..." style={{resize:'none', lineHeight:1.5}}
            value={form.notes} onChange={e => set('notes', e.target.value)}/>
        </div>

        <button className="btn btn-primary btn-full" onClick={save} style={{marginBottom:16}}>
          🏃 Guardar sesión
        </button>
      </div>
    </div>
  );
}

// SCREEN: PROGRESIÓN — charts per exercise
// ====================================================
function ProgressionScreen() {
  const [selectedType, setSelectedType] = useState('pull');
  const [selectedEx, setSelectedEx] = useState(null);
  const exList = D.exercises.fase2[selectedType] || [];

  function getProgress(exId) {
    return DB.getExerciseHistory(exId);
  }

  const runSessions = DB.getRunSessions().sort((a,b) => a.date.localeCompare(b.date));
  const runDistances = runSessions.map(s => s.distance);
  const runPaces = runSessions.map(s => {
    const [m, sec] = s.pace.split(':').map(Number);
    return m + sec/60;
  });

  if (selectedEx) {
    const ex = exList.find(e => e.id === selectedEx);
    const history = getProgress(selectedEx);
    const weights = history.map(h => h.weight);
    const pr = Math.max(...weights);
    return (
      <div className="screen">
        <div style={{padding:'16px 20px 12px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:12}}>
          <button className="back-btn" onClick={() => setSelectedEx(null)}>‹ Progresión</button>
          <div style={{flex:1}}></div>
          <span className={`badge badge-${selectedType}`}>{typeLabel(selectedType)}</span>
        </div>
        <div className="page-header" style={{paddingTop:16}}>
          <div>
            <div style={{fontSize:20, fontWeight:700, letterSpacing:'-0.3px'}}>{ex?.name}</div>
            <div style={{fontSize:12, color:'var(--muted)', marginTop:2}}>{history.length} registros</div>
          </div>
        </div>
        {/* PR badge */}
        <div className="metric-row">
          <div className="metric-card">
            <div className="metric-value" style={{color:'var(--accent)'}}>{pr}kg</div>
            <div className="metric-label">⭐ Mejor marca</div>
          </div>
          <div className="metric-card">
            <div className="metric-value">{weights[weights.length-1]}kg</div>
            <div className="metric-label">Peso actual</div>
          </div>
          <div className="metric-card">
            <div className="metric-value" style={{color:'var(--leg)'}}>+{(pr - weights[0]).toFixed(1)}kg</div>
            <div className="metric-label">Progresión total</div>
          </div>
        </div>
        {/* Chart */}
        <div className="card">
          <div style={{fontSize:12, fontWeight:600, color:'var(--muted)', marginBottom:10}}>EVOLUCIÓN DE PESO (kg)</div>
          <MiniChart data={weights} color={typeColor(selectedType)} height={80}/>
          <div style={{display:'flex', justifyContent:'space-between', marginTop:6}}>
            <span style={{fontSize:10, color:'var(--muted)'}}>{formatDate(history[0]?.date)}</span>
            <span style={{fontSize:10, color:'var(--muted)'}}>{formatDate(history[history.length-1]?.date)}</span>
          </div>
        </div>
        {/* History table */}
        <div className="section-label">Historial</div>
        {history.slice().reverse().map((h, i) => (
          <div key={i} style={{display:'flex', alignItems:'center', padding:'10px 20px', borderBottom:'1px solid var(--border)', gap:12}}>
            <div style={{fontSize:12, color:'var(--muted)', width:70, flexShrink:0}}>{formatDate(h.date)}</div>

function PlanScreen({ onNavigate }) {
  const [selected, setSelected] = useState('pull');
  const activePh = getActiveWeightsPhase();
  const exList = D.exercises.fase2[selected] || [];
  const lastSession = DB.getLastSession(selected);

  function getSuggestion(ex) {
    if (!lastSession) return null;
    const prev = lastSession.exercises?.find(e => e.id === ex.id);
    if (!prev) return null;
    const allGood = prev.sets.every(s => s.reps >= (ex.reps || 10));
    if (allGood) return { weight: ex.weight + ex.increment, suggestion: 'Subir peso', color: 'var(--leg)' };
    const anyFail = prev.sets.some(s => s.reps < (ex.reps || 10) - 2);
    if (anyFail) return { weight: ex.weight, suggestion: 'Mantener peso', color: 'var(--tennis)' };
    return { weight: ex.weight, suggestion: 'Consolidar', color: 'var(--muted2)' };
  }

  return (
    <div className="screen">
      <div className="page-header">
        <div className="page-title">Plan</div>
        <div style={{fontSize:12, color:'var(--accent)', fontWeight:600}}>{activePh?.name.split(' — ')[1]}</div>
      </div>

      {/* Day selector */}
      <div style={{display:'flex', gap:6, padding:'0 16px 4px'}}>
        {[['pull','Pull','var(--pull)'],['push','Push','var(--push)'],['leg','Leg','var(--leg)']].map(([val, label, col]) => (
          <button key={val} onClick={() => setSelected(val)} style={{flex:1, padding:'8px', borderRadius:10, border:`1px solid ${selected===val ? col : 'var(--border)'}`,

          </button>
        ))}
      </div>

      {/* Progression philosophy */}
      <div style={{margin:'12px 16px 0'}}>
        <div className="alert alert-info" style={{marginBottom:0}}>
          {Icons.info}
          <div className="alert-text" style={{fontSize:11}}>Bloques 8 semanas · Solo 1-2 ejercicios suben por semana · No cambiar por aburrimiento</div>
        </div>
      </div>

      <div className="section-label">Ejercicios — Próxima sesión</div>

        const suggestion = getSuggestion(ex);
        return (
          <div key={ex.id} className="card" style={{margin:'0 16px 8px', padding:'12px 14px'}}>
            <div style={{display:'flex', alignItems:'flex-start', gap:10}}>
              <div style={{width:26, height:26, borderRadius:'50%', background:`${typeColor(selected)}20`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:typeColor(selected), flexShrink:0, marginTop:2}}>{i+1}</div>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:'flex', alignItems:'center', gap:6, flexWrap:'wrap'}}>
                  <span style={{fontSize:14, fontWeight:700}}>{ex.name}</span>
                  {ex.isCore && <span className="tag tag-new">Core</span>}
                  {i >= exList.length - 2 && !ex.isCore && <span className="tag tag-new">NUEVO</span>}
                </div>
                <div style={{fontSize:12, color:'var(--muted)', marginTop:3}}>
                  {ex.isCore ? '3×45s plancha + 3×12 hollow rocks' : `${ex.series} series × ${ex.reps || 15} reps`}
                </div>
                {ex.notes && <div style={{fontSize:11, color:'var(--muted2)', marginTop:4, fontStyle:'italic'}}>{ex.notes}</div>}
              </div>
              <div style={{textAlign:'right', flexShrink:0}}>
                {!ex.isCore && (
                  <>

function generateReport() {
  const today = new Date();
  const ws = DB.getAllSessions().sort((a, b) => b.date.localeCompare(a.date));
  const rs = DB.getRunSessions().sort((a, b) => b.date.localeCompare(a.date));
  const ts = DB.getTennisSessions().sort((a, b) => b.date.localeCompare(a.date));
  const ap = getActiveWeightsPhase();
  const rp = getActiveRunPhase();
  const tw = ap ? Math.round((new Date(ap.end) - new Date(ap.start)) / (7 * 24 * 3600 * 1000)) : 8;
  const streak = DB.getRunStreak();

  let r = `=== INFORME DE ENTRENAMIENTO — Pablo ===
Fecha: ${today.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' })}

PERFIL: Pablo, 1.83m, ~80kg, nivel intermedio. Creatina 5g/día.
OBJETIVO: Reducir grasa abdominal + masa muscular + fuerza progresiva.
META: Media maratón — octubre 2026.

FASES ACTIVAS
• Pesas: ${ap?.name} — semana ${weeksElapsed(ap?.start)}/${tw}
• Running: ${rp?.name}
• Racha running: ${streak} semanas consecutivas

`;

  r += `ÚLTIMAS SESIONES DE PESAS\n`;
  ws.slice(0, 6).forEach(s => {
    r += `\n[${s.date} — ${s.type.toUpperCase()} DAY]\n`;
    (s.exercises || []).forEach(ex => {
      const def = (D.exercises.fase2[s.type] || []).find(e => e.id === ex.id);
      const name = def?.name || ex.id;
      const sets = (ex.sets || []).map(st => `${st.reps}×${st.weight}kg`).join(' / ');
      const hit = def && !def.isCore && (ex.sets || []).every(st => st.reps >= (def.reps || 10));
      r += `  ${name}: ${sets}${hit ? ' ✅ objetivo' : ''}\n`;
    });
  });

  r += `\nRUNNING RECIENTE\n`;
  if (rs.length === 0) r += '  Sin sesiones registradas\n';
  rs.slice(0, 5).forEach(s => {
    r += `  ${s.date}: ${s.distance}km @ ${s.pace}/km +${s.elevation}m${s.notes ? ' — "' + s.notes + '"' : ''}\n`;
  });

  r += `\nTENIS RECIENTE\n`;
  if (ts.length === 0) r += '  Sin sesiones registradas\n';
  ts.slice(0, 3).forEach(s => {
    r += `  ${s.date}: ${s.duration}min\n`;
  });

  r += `\nPROGRESIÓN DESDE FASE 1\n`;
  let progLines = 0;
  Object.entries(D.progressionData).forEach(([id, data]) => {
    if (data.length < 2 || progLines >= 8) return;
    const name = Object.values(D.exercises.fase2).flat().find(e => e.id === id)?.name || id;
    const first = data[0].weight;
    const last = data[data.length - 1].weight;
    const diff = (last - first).toFixed(1);
    if (parseFloat(diff) !== 0) { r += `  ${name}: ${first}kg → ${last}kg (${parseFloat(diff) > 0 ? '+' : ''}${diff}kg)\n`; progLines++; }
  });

  r += `\nINSIGHTS ACTUALES\n`;
  generateInsights().forEach(i => { r += `  ${i.icon} ${i.title}: ${i.text}\n`; });

  r += `\nREGLAS DE PROGRESIÓN
• Bloques 8 semanas sin cambiar ejercicios
• Solo 1-2 ejercicios suben por semana — no subir hasta consolidar reps (10-12)
• Técnica antes que peso
• Running Fase 1: ritmo conversacional, nunca zona umbral
• Push Day + Tenis mismo día: cuidar hombro anterior
`;

  return r;
}

// ====================================================
// INSIGHTS GENERATOR
// ====================================================
function generateInsights() {
  const today = new Date();
  const ins = [];
  const ws = DB.getAllSessions().sort((a,b) => b.date.localeCompare(a.date));
  const rs = DB.getRunSessions().sort((a,b) => b.date.localeCompare(a.date));
  const ap = getActiveWeightsPhase();

  // Running frequency
  if (rs.length > 0) {
    const days = Math.floor((today - new Date(rs[0].date + 'T00:00:00')) / 86400000);
    if (days >= 8)
      ins.push({ icon: '⚠️', color: 'var(--push)', title: 'Running atrasado',
        text: `Llevas ${days} días sin correr. Fase 1 requiere 2 sesiones/semana para construir la base aeróbica.` });
    else if (days <= 2)
      ins.push({ icon: '✅', color: 'var(--leg)', title: 'Running al día',
        text: `Última sesión hace ${days === 0 ? 'hoy' : days + 'd'} — ${rs[0].distance}km a ${rs[0].pace}/km. Buen ritmo.` });
  } else {
    ins.push({ icon: '🏃', color: 'var(--running)', title: 'Sin sesiones de running',
      text: 'Registra tu primera sesión para empezar a ver tu progresión aeróbica.' });
  }

  // Progression readiness
  ['pull', 'push', 'leg'].forEach(type => {
    const last = DB.getLastSession(type);
    if (!last) return;
    const defs = D.exercises.fase2[type] || [];
    const ready = [];
    (last.exercises || []).forEach(ex => {
      const def = defs.find(e => e.id === ex.id);
      if (!def || def.isCore || !def.increment) return;
      if ((ex.sets || []).every(s => s.reps >= (def.reps || 10))) ready.push(def.name);
    });
    if (ready.length > 0) {
      const days = Math.floor((today - new Date(last.date + 'T00:00:00')) / 86400000);
      ins.push({ icon: '📈', color: typeColor(type), title: `${typeLabel(type)} Day — Listo para subir`,
        text: `Último ${typeLabel(type)} hace ${days}d: reps objetivo cumplidas en ${ready.slice(0,2).join(', ')}${ready.length > 2 ? ` +${ready.length-2}` : ''}. Considera subir peso.` });
    }
  });

  // Phase ending soon
  if (ap) {
    const rem = weeksUntil(ap.end);
    if (rem <= 2 && rem > 0)
      ins.push({ icon: '🔔', color: 'var(--tennis)', title: 'Fase terminando pronto',
        text: `Quedan ${rem} semana${rem > 1 ? 's' : ''} de ${ap.name.split(' — ')[1]}. Piensa ya en qué ejercicios priorizar en Fase 3.` });
  }

  // Running pace trend
  if (rs.length >= 4) {
    const toPace = s => { const [m, sc] = s.pace.split(':').map(Number); return m * 60 + sc; };
    const recent = rs.slice(0, 3).map(toPace);
    const older = rs.slice(3, 6).map(toPace);
    if (older.length > 0) {
      const diff = (older.reduce((a, b) => a + b, 0) / older.length) - (recent.reduce((a, b) => a + b, 0) / recent.length);
      if (diff > 10)
        ins.push({ icon: '🚀', color: 'var(--running)', title: 'Ritmo mejorando',
          text: `Tu ritmo medio ha mejorado ~${Math.round(diff)}s/km en las últimas sesiones. Sigue en zona conversacional para consolidar.` });
    }
  }

  // Today conflict
  const dow = today.getDay();
  const todaySch = D.weekSchedule[dow] || [];
  if (todaySch.some(s => s.type === 'push') && todaySch.some(s => s.type === 'tennis'))
    ins.unshift({ icon: '⚠️', color: 'var(--push)', title: 'Hombro en riesgo hoy',
      text: 'Push Day + Tenis el mismo día. Deja ≥4h entre sesiones y reduce volumen de empuje si notas fatiga.' });

  // Long inactivity
  const all = [...ws, ...rs].sort((a, b) => b.date.localeCompare(a.date));
  if (all.length > 0) {
    const days = Math.floor((today - new Date(all[0].date + 'T00:00:00')) / 86400000);
    if (days >= 5)
      ins.push({ icon: '💤', color: 'var(--muted2)', title: `${days} días sin entrenar`,
        text: 'Si no es descanso planificado, retoma con una sesión suave para volver al ritmo.' });
  }

  return ins.slice(0, 5);
}

function CoachScreen() {
  const [apiKey, setApiKey] = useState(() => localStorage.getItem('tt_apikey') || '');
  const [keyInput, setKeyInput] = useState('');
  const [showKey, setShowKey] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);
  const insights = generateInsights();

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

  function saveKey() {
    if (!keyInput.trim()) return;
    localStorage.setItem('tt_apikey', keyInput.trim());
    setApiKey(keyInput.trim());
    setKeyInput('');
    setShowKey(false);
  }

  function buildSystemPrompt() {
    const ws = DB.getAllSessions().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
    const rs = DB.getRunSessions().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
    const ap = getActiveWeightsPhase();
    const rp = getActiveRunPhase();
    const tw = ap ? Math.round((new Date(ap.end) - new Date(ap.start)) / (7 * 24 * 3600 * 1000)) : 8;
    return `Eres el entrenador personal de Pablo. Responde siempre en español. Sé directo, concreto y motivador.

${ws.map(s => `${s.date} ${s.type.toUpperCase()}: ${(s.exercises || []).map(e => `${e.id}[${(e.sets || []).map(st => `${st.reps}×${st.weight}kg`).join(',')}]`).join(' | ')}`).join('\n')}

${rs.map(s => `${s.date}: ${s.distance}km @ ${s.pace}/km +${s.elevation}m${s.notes ? ' "' + s.notes + '"' : ''}`).join('\n')}

Responde en máximo 3-4 frases salvo que pidan análisis detallado. Usa los datos reales.`;

    '¿Voy bien para la media maratón de octubre?'

    const q = (text || input).trim();
    if (!q || loading || !apiKey) return;
    const hist = [...messages, { role: 'user', content: q }];

    setInput('');

          'x-api-key': apiKey,

          borderLeft: `3px solid ${ins.color}`, display: 'flex', gap: 12, alignItems: 'flex-start'
        }}>
          <span style={{ fontSize: 20, flexShrink: 0, lineHeight: 1.4 }}>{ins.icon}</span>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 3, color: ins.color }}>{ins.title}</div>
            <div style={{ fontSize: 12, color: 'var(--muted2)', lineHeight: 1.5 }}>{ins.text}</div>
          </div>
        </div>
      ))}

      {apiKey ? (
        <>
          <div className="section-label" style={{ marginTop: 4 }}>Chat con el coach</div>
          {messages.length === 0 && (
            <div style={{ padding: '0 16px 10px', display: 'flex', flexDirection: 'column', gap: 6 }}>
              {QUICK.map((q, i) => (
                <button key={i} onClick={() => send(q)} style={{
                  textAlign: 'left', padding: '10px 14px', borderRadius: 'var(--radius-sm)',
                  background: 'var(--surface)', border: '1px solid var(--border)',
                  color: 'var(--muted2)', fontSize: 13, fontFamily: 'var(--font)', cursor: 'pointer'
                }}>
                  {q}
                </button>
              ))}
            </div>
          )}
          {messages.length > 0 && (
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 10 }}>
              {messages.map((m, i) => (
                <div key={i} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                  <div style={{
                    maxWidth: '84%', padding: '10px 14px', fontSize: 14, lineHeight: 1.5,
                    borderRadius: m.role === 'user' ? '16px 16px 4px 16px' : '4px 16px 16px 16px',
                    background: m.role === 'user' ? 'var(--accent)' : 'var(--surface)',
                    border: m.role === 'user' ? 'none' : '1px solid var(--border)',
                    color: m.role === 'user' ? '#fff' : 'var(--text)',
                    whiteSpace: 'pre-wrap'
                  }}>{m.content}</div>
                </div>
              ))}
              {loading && (
                <div style={{ display: 'flex', justifyContent: 'flex-start' }}>
                  <div style={{
                    padding: '14px 16px', borderRadius: '4px 16px 16px 16px',
                    background: 'var(--surface)', border: '1px solid var(--border)',
                    display: 'flex', gap: 5, alignItems: 'center'
                  }}>
                    {[0, 1, 2].map(k => (
                      <div key={k} style={{
                        width: 7, height: 7, borderRadius: '50%', background: 'var(--muted)',
                        animation: `bounce 1.2s ease-in-out ${k * 0.2}s infinite`
                      }} />
                    ))}
                  </div>
                </div>
              )}
              <div ref={endRef} />
            </div>
          )}
          <div style={{ padding: '0 16px 16px', display: 'flex', gap: 8 }}>
            <input className="input" placeholder="Pregunta a tu coach..."
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && send()}
              disabled={loading} style={{ flex: 1, fontSize: 14 }} />
            <button className="btn btn-primary" onClick={() => send()}
              disabled={loading || !input.trim()}
              style={{ padding: '10px 16px', flexShrink: 0 }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </>
      ) : (
        <div className="card" style={{ margin: '0 16px 16px', textAlign: 'center', padding: '24px 20px' }}>
          <div style={{ fontSize: 36, marginBottom: 10 }}>✨</div>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>Chat con el coach</div>
          <div style={{ fontSize: 12, color: 'var(--muted)', lineHeight: 1.6, marginBottom: 16 }}>
            Conecta tu API key de Anthropic para chatear con un coach que conoce todo tu historial.
          </div>
          <button className="btn btn-secondary btn-sm" onClick={() => setShowKey(true)}>
            Configurar API key
          </button>
        </div>
      )}
    </div>
  );
}

// ====================================================
// MAIN APP — navigation
// ====================================================
function App() {
  const [tab, setTab] = useState('home');
  const [subScreen, setSubScreen] = useState(null);
  const [subParams, setSubParams] = useState(null);

  const [tweaks, setTweak] = useTweaks(/*EDITMODE-BEGIN*/{
    "accentColor": "#f97316",
    "darkMode": true,
    "compactMode": false
  }/*EDITMODE-END*/);

  useEffect(() => {
    if (tweaks.accentColor) {
      document.documentElement.style.setProperty('--accent', tweaks.accentColor);
      document.documentElement.style.setProperty('--running', tweaks.accentColor);
    }
    document.documentElement.style.setProperty('--bg', tweaks.darkMode ? '#0a0a0a' : '#f5f5f5');
    document.documentElement.style.setProperty('--text', tweaks.darkMode ? '#f0f0f0' : '#0a0a0a');
    document.documentElement.style.setProperty('--surface', tweaks.darkMode ? '#141414' : '#ffffff');
    document.documentElement.style.setProperty('--surface2', tweaks.darkMode ? '#1c1c1c' : '#f0f0f0');
    document.documentElement.style.setProperty('--surface3', tweaks.darkMode ? '#242424' : '#e8e8e8');
    document.documentElement.style.setProperty('--border', tweaks.darkMode ? '#2a2a2a' : '#e0e0e0');
    document.documentElement.style.setProperty('--muted', tweaks.darkMode ? '#666' : '#888');
    document.documentElement.style.setProperty('--muted2', tweaks.darkMode ? '#888' : '#666');
  }, [tweaks.accentColor, tweaks.darkMode]);

  function navigate(screen, params) {
    setSubScreen(screen);
    setSubParams(params || null);
  }
  function goBack() {
    setSubScreen(null);
    setSubParams(null);
  }

  const tabs = [
    { id: 'home', label: 'Inicio', icon: Icons.home },
    { id: 'session', label: 'Sesión', icon: Icons.dumbbell },
    { id: 'run', label: 'Running', icon: Icons.run },
    { id: 'progress', label: 'Progres.', icon: Icons.chart },
    { id: 'history', label: 'Historial', icon: Icons.history },
  ];

  // Render sub-screen overlay
  let content;
  if (subScreen === 'session') {
    content = <SessionScreen key={`session-${subParams?.type}`} params={subParams} onNavigate={navigate} onBack={goBack}/>;
  } else if (subScreen === 'run-log') {
    content = <RunLogScreen onBack={goBack}/>;
  } else if (subScreen === 'run-history') {
    content = <HistoryScreen onNavigate={navigate}/>;
  } else {
    content = (
      <div key={tab} style={{position:'absolute', inset:0}}>
        {tab === 'home' && <Dashboard onNavigate={navigate}/>}
        {tab === 'session' && <PlanScreen onNavigate={navigate}/>}
        {tab === 'run' && <RunLogScreen onBack={() => setTab('home')}/>}
        {tab === 'progress' && <ProgressionScreen/>}
        {tab === 'history' && <HistoryScreen onNavigate={navigate}/>}
      </div>
    );
  }

  return (
    <>
    <div className="phone-shell">
      {/* App header */}
      <div className="app-header">
        <span style={{fontSize:20}}>☕</span>
        <span>Caffeine</span>
      </div>

      {/* Main content */}
      <div className="screen-container">
        <div className={subScreen ? 'screen-slide-in' : ''} style={{height:'100%'}}>
          {content}
        </div>
      </div>

      {/* Tab bar (hidden during sub-screens) */}
      {!subScreen && (
        <div className="tab-bar">
          {tabs.map(t => (
            <button key={t.id} className={`tab-item ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
              {t.icon}
              <span>{t.label}</span>
            </button>
          ))}
        </div>
      )}
    </div>
    <TweaksPanel>
      <TweakSection label="Apariencia" />
      <TweakColor label="Color acento" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
      <TweakToggle label="Modo oscuro" value={tweaks.darkMode} onChange={v => setTweak('darkMode', v)} />
      <TweakToggle label="Modo compacto" value={tweaks.compactMode} onChange={v => setTweak('compactMode', v)} />
    </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/Caffeine/sw.js', { scope: '/Caffeine/' })
      .catch(e => console.warn('SW:', e));
  });
}
</script>
</body>
</html>
